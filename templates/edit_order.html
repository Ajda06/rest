<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Редакция на поръчка</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='orders_admin.css') }}">
</head>
<body>

    <h1>Редактирай поръчка #{{ order.id }}</h1>

    <p><strong>Потребител:</strong> {{ order.username }}</p>
    <p><strong>Ястие:</strong> {{ order.dish_name }}</p>
    <p><strong>Текущ статус:</strong> {{ order.status }}</p>

    <form method="POST">
        <label for="status">Промени статус:</label>
        <select name="status" id="status">
            <option value="active" {% if order.status == 'active' %}selected{% endif %}>Активна</option>
            <option value="completed" {% if order.status == 'completed' %}selected{% endif %}>Завършена</option>
        </select>
        <br><br>
        <button type="submit">Запази</button>
    </form>

    <br>
    <a href="{{ url_for('view_orders') }}">⬅ Назад</a>

</body>
</html>
